<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sophie & Rashed's Alaska Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #0b2545 0%, #134074 45%, #1b6ca8 100%);
    color: #fff;
    padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 40px 34px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    text-align: center;
  }
  .icon { font-size: 46px; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 13px; opacity: 0.75; margin-bottom: 26px; font-weight: 300; }
  label { display: block; text-align: left; font-size: 12px; opacity: 0.8; margin: 14px 0 6px; font-weight: 600; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.95);
    color: #0b2545;
    font-size: 15px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid #7cc4ff; }
  button {
    margin-top: 22px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #ffd166;
    color: #0b2545;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.06s ease, background 0.2s ease;
  }
  button:hover { background: #ffdb85; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: default; }
  .err { color: #ff9aa2; font-size: 13px; margin-top: 14px; min-height: 18px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card" id="gate">
    <div class="icon">🏔️</div>
    <h1>Alaska Adventure</h1>
    <div class="sub">This trip is private. Please sign in.</div>
    <form id="form" autocomplete="off">
      <label for="u">Username</label>
      <input id="u" type="text" autocapitalize="none" autocomplete="username" required>
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <button id="btn" type="submit">Unlock Trip</button>
    </form>
    <div class="err" id="err"></div>
  </div>

const b64ToBytes = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0));

async function unlock(username, password) {
  const enc = new TextEncoder();
  const passphrase = username.trim().toLowerCase() + ':' + password;
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv = b64ToBytes(PAYLOAD.iv);
  const ct = b64ToBytes(PAYLOAD.ct);

  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(plainBuf);
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const u = document.getElementById('u').value;
  const p = document.getElementById('p').value;
  err.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Unlocking…';
  try {
    const html = await unlock(u, p);
    document.open();
    document.write(html);
    document.close();
  } catch (_) {
    err.textContent = 'Incorrect username or password.';
    btn.disabled = false;
    btn.textContent = 'Unlock Trip';
  }
});
